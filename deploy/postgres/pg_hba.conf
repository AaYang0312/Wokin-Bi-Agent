# BI Agent PostgreSQL（容器内）客户端认证
#
# 与迁移前 D:\Projects\pg17\data\pg_hba.conf 保持同一套「本机免密」语义，
# 所以 .env.app / .env.test / .env.sync* 里的 DSN 可以继续不写密码。
#
# 关键前提：Docker Desktop 在 Windows 上会对入站连接做转发/源地址改写，
# 容器里看到的源地址通常是 Docker 内部网段，而不是真实的 tailscale 对端 IP。
# 因此这里的地址白名单只表达意图，不能当作访问控制手段；
# 真正的边界是「哪些宿主接口发布了 54329」+「Windows 防火墙入站规则」，
# 见 deploy/postgres/README.md 的防火墙章节（只放行 100.64.0.0/10 tailnet 段）。
#
# 修改后热加载：docker exec bi-agent-postgres psql -U postgres -c "select pg_reload_conf()"

# TYPE  DATABASE  USER        ADDRESS         METHOD
local   all       all                         trust
host    all       all         127.0.0.1/32    trust
host    all       all         ::1/128         trust

# Tailscale tailnet：整段 CGNAT
# 注意：本行实际上不会被命中——走发布端口进来的连接已被 Docker 改写成 Docker 网关地址，
# 真正命中的是下面 172.16.0.0/12 那行。迁移前旧集群里的「对端 /32 白名单」因此已删除
# （保留也无意义）；若要按真实对端 IP 控制访问，请用 Windows 防火墙规则（见 README）。
host    all       all         100.64.0.0/10       trust

# Docker Desktop / WSL2 转发后的源地址段
host    all       all         172.16.0.0/12       trust
host    all       all         192.168.0.0/16      trust

# 收紧示例（需要密码时把上面 host 行换成 scram-sha-256，并同步改所有 DSN）：
# host    all       all         100.64.0.0/10       scram-sha-256
